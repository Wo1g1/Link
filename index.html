<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Link</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="메뉴">
      <button class="tab" role="tab" id="t-links" data-tab="links" aria-controls="p-links">링크</button>
      <button class="tab" role="tab" id="t-calendar" data-tab="calendar" aria-controls="p-calendar">일정</button>
      <button class="tab" role="tab" id="t-notices" data-tab="notices" aria-controls="p-notices">알림<span class="count" id="nCount" hidden></span></button>
    </div>

    <section class="panel" id="p-links" role="tabpanel" aria-labelledby="t-links">
      <nav class="links" id="linkList"></nav>
    </section>

    <section class="panel" id="p-calendar" role="tabpanel" aria-labelledby="t-calendar" hidden>
      <div class="card">
        <div class="cal-head">
          <div class="cal-title">
            <select id="yearSel" aria-label="년도"></select>
            <select id="monthSel" aria-label="월"></select>
          </div>
          <div class="cal-nav">
            <button type="button" id="prev" aria-label="이전 달">&lsaquo;</button>
            <button type="button" id="next" aria-label="다음 달">&rsaquo;</button>
          </div>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="days"></div>
        <div class="events" id="events" hidden>
          <h3 id="selLabel"></h3>
          <div id="evList"></div>
        </div>
      </div>
    </section>

    <section class="panel" id="p-notices" role="tabpanel" aria-labelledby="t-notices" hidden>
      <div id="noticeList"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
